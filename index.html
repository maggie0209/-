<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday! 🎂</title>
  <!-- 引入輕量彩帶特效庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #fcfaf7;
      --card-bg: #ffffff;
      --accent: #e07a5f;
      --text: #3d405b;
      --text-sub: #7d8296;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    /* 拍立得照片樣式 */
    .polaroid {
      background: #fff;
      padding: 10px 10px 18px 10px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
      margin-bottom: 20px;
    }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.02);
    }

    .polaroid-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .hint {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* 麥克風按鈕 */
    .btn-mic {
      background: #f4f1de;
      color: var(--text);
      border: 1px solid #e2ddc4;
      padding: 8px 18px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s ease;
    }

    /* 蠟燭本體結構 */
    .candle-stage {
      position: relative;
      width: 80px;
      height: 120px;
      margin: 0 auto 20px;
      cursor: pointer;
    }

    .candle-stick {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 70px;
      background: repeating-linear-gradient(
        45deg,
        #f4a261,
        #f4a261 8px,
        #fff 8px,
        #fff 16px
      );
      border-radius: 6px 6px 4px 4px;
      box-shadow: inset -3px 0 0 rgba(0,0,0,0.1);
    }

    .wick {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 10px;
      background: #444;
      border-radius: 2px;
    }

    /* 火焰 */
    .flame {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 30px;
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffbe0b 50%, #fb5607 100%);
      border-radius: 50% 50% 35% 35% / 80% 80% 30% 30%;
      box-shadow: 0 0 20px rgba(251, 86, 7, 0.6);
      animation: flicker 0.15s infinite alternate;
      transform-origin: bottom center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) rotate(-1deg) scale(1); }
      100% { transform: translateX(-50%) rotate(1.5deg) scale(1.06); }
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
    }

    /* 熄滅煙霧 */
    .smoke {
      position: absolute;
      top: -20px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(180, 180, 180, 0.7);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .flame.out ~ .smoke {
      animation: rise-smoke 1.6s forwards ease-out;
    }

    @keyframes rise-smoke {
      0% { opacity: 0.8; transform: translate(-50%, 0) scale(1); }
      50% { opacity: 0.4; transform: translate(-70%, -20px) scale(2.2); }
      100% { opacity: 0; transform: translate(-30%, -40px) scale(3.5); }
    }

    /* 祝福卡片（熄滅後才顯現打字機內容） */
    .message-box {
      display: none;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text);
      text-align: left;
      min-height: 90px;
      white-space: pre-wrap;
      background: #faf8f5;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid #f0eae1;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
    }

    .message-box.revealed {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. 拍立得照片 (可換成 photo.jpg 或線上圖床連結) -->
    <div class="polaroid">
      <img class="polaroid-img" src="photo.jpg" alt="Memory Photo" onerror="this.src='https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=800&auto=format&fit=crop'" />
    </div>

    <h1>Happy Birthday! 🎈</h1>

    <p class="hint" id="statusText">許個願望，對著麥克風輕輕吹氣吹熄蠟燭<br/>（也可以直接點擊蠟燭喔！）</p>

    <!-- 2. 麥克風授權鈕 -->
    <button class="btn-mic" id="micBtn" onclick="enableMicrophone()">
      🎤 啟用吹氣感應
    </button>

    <!-- 3. 蠟燭本體 -->
    <div class="candle-stage" onclick="extinguishCandle()">
      <div class="candle-stick">
        <div class="wick">
          <div class="flame" id="flame"></div>
          <div class="smoke"></div>
        </div>
      </div>
    </div>

    <!-- 4. 吹熄後顯示的打字機卡片內容 -->
    <div class="message-box" id="typewriterText"></div>
  </div>

  <script>
    /* ========== 1. 祝賀文字內容設定 ========== */
    const message = "願你新的一歲依然閃閃發光！✨\n生活有溫柔、工作有成就，所有許下的願望都能如期成真。\n新的一歲，繼續快樂前行，生日快樂！🎂🎉";

    let isBlownOut = false;
    let audioContext, analyser, microphone, javascriptNode;

    /* ========== 2. 麥克風收音偵測吹氣 ========== */
    async function enableMicrophone() {
      const micBtn = document.getElementById("micBtn");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micBtn.innerText = "✨ 麥克風已就緒，請對手機底部吹氣";
        micBtn.style.background = "#e8f5e9";
        micBtn.style.borderColor = "#c8e6c9";

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

        analyser.smoothingTimeConstant = 0.4;
        analyser.fftSize = 1024;

        microphone.connect(analyser);
        analyser.connect(javascriptNode);
        javascriptNode.connect(audioContext.destination);

        javascriptNode.onaudioprocess = () => {
          if (isBlownOut) return;
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);

          let values = 0;
          for (let i = 0; i < array.length; i++) {
            values += array[i];
          }
          const average = values / array.length;

          // 吹氣震幅門檻
          if (average > 48) {
            extinguishCandle();
          }
        };
      } catch (err) {
        micBtn.innerText = "直接點擊蠟燭也能吹熄喔 👆";
      }
    }

    /* ========== 3. 熄滅蠟燭、放彩帶、啟動打字機 ========== */
    function extinguishCandle() {
      if (isBlownOut) return;
      isBlownOut = true;

      // 熄火與更新文案
      document.getElementById("flame").classList.add("out");
      document.getElementById("statusText").innerText = "✨ 願望已封存，新的一歲一切順利！";
      document.getElementById("micBtn").style.display = "none";

      // 關閉麥克風資源
      if (audioContext && audioContext.state !== "closed") {
        audioContext.close();
      }

      // 彩帶特效
      celebrateConfetti();

      // 顯示打字機容器並開始逐字印出
      const box = document.getElementById("typewriterText");
      box.classList.add("revealed");
      setTimeout(startTypeWriter, 400);
    }

    /* ========== 4. 打字機逐字動畫 ========== */
    let typeIndex = 0;
    function startTypeWriter() {
      const textElement = document.getElementById("typewriterText");
      if (typeIndex < message.length) {
        textElement.innerHTML += message.charAt(typeIndex);
        typeIndex++;
        setTimeout(startTypeWriter, 45);
      }
    }

    /* ========== 5. 雙側發射彩帶 ========== */
    function celebrateConfetti() {
      confetti({
        particleCount: 90,
        spread: 70,
        origin: { x: 0.25, y: 0.65 }
      });
      confetti({
        particleCount: 90,
        spread: 70,
        origin: { x: 0.75, y: 0.65 }
      });
    }
  </script>
</body>
</html>
