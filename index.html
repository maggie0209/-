<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make a Wish! 🎂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #fcfaf7;
      --card-bg: #ffffff;
      --accent: #e07a5f;
      --text: #3d405b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      max-width: 400px;
      width: 100%;
      padding: 36px 24px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .hint {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 36px;
    }

    /* 蠟燭舞台 */
    .candle-stage {
      position: relative;
      width: 100px;
      height: 140px;
      margin: 0 auto 32px;
      cursor: pointer;
    }

    /* 蠟燭本體 */
    .candle-stick {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 80px;
      background: repeating-linear-gradient(
        45deg,
        #f4a261,
        #f4a261 8px,
        #fff 8px,
        #fff 16px
      );
      border-radius: 6px 6px 4px 4px;
      box-shadow: inset -3px 0 0 rgba(0,0,0,0.1);
    }

    /* 燭芯 */
    .wick {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 12px;
      background: #444;
      border-radius: 2px;
    }

    /* 火焰 */
    .flame {
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 34px;
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffbe0b 50%, #fb5607 100%);
      border-radius: 50% 50% 35% 35% / 80% 80% 30% 30%;
      box-shadow: 0 0 20px rgba(251, 86, 7, 0.6);
      animation: flicker 0.15s infinite alternate;
      transform-origin: bottom center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) rotate(-1deg) scale(1); }
      100% { transform: translateX(-50%) rotate(1.5deg) scale(1.06); }
    }

    /* 熄滅效果 */
    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
    }

    /* 熄滅後的青煙 */
    .smoke {
      position: absolute;
      top: -24px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(180, 180, 180, 0.7);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .flame.out ~ .smoke {
      animation: rise-smoke 1.6s forwards ease-out;
    }

    @keyframes rise-smoke {
      0% { opacity: 0.8; transform: translate(-50%, 0) scale(1); }
      50% { opacity: 0.4; transform: translate(-70%, -24px) scale(2.2); }
      100% { opacity: 0; transform: translate(-30%, -48px) scale(3.5); }
    }

    /* 許願完成祝賀詞 (初始隱藏) */
    .wish-message {
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.6s ease 0.4s;
      line-height: 1.7;
      font-size: 1rem;
      background: #faf8f5;
      padding: 16px;
      border-radius: 14px;
    }

    .wish-message.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* 啟動麥克風按鈕 */
    .btn-mic {
      background: #f4f1de;
      color: var(--text);
      border: 1px solid #e2ddc4;
      padding: 8px 18px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Make a Birthday Wish 🎂</h1>
    <p class="hint" id="statusText">許個願望，對著麥克風吹口氣吹熄蠟燭</p>

    <!-- 麥克風啟動按鈕 (因瀏覽器限制需由使用者手動授權) -->
    <div>
      <button class="btn-mic" id="micBtn" onclick="enableMicrophone()">
        🎤 點擊啟用麥克風感應
      </button>
    </div>

    <!-- 蠟燭主體（支援直接點擊/觸控點熄） -->
    <div class="candle-stage" onclick="extinguishCandle()">
      <div class="candle-stick">
        <div class="wick">
          <div class="flame" id="flame"></div>
          <div class="smoke"></div>
        </div>
      </div>
    </div>

    <!-- 熄滅後顯現的祝福卡片 -->
    <div class="wish-message" id="wishCard">
      🎉 願望一定會實現！<br />
      新的一歲平安順心、心想事成！
    </div>
  </div>

  <script>
    let isBlownOut = false;
    let audioContext, analyser, microphone, javascriptNode;

    // 1. 啟用麥克風監聽
    async function enableMicrophone() {
      const micBtn = document.getElementById("micBtn");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micBtn.innerText = "✨ 麥克風已就緒，請對手機底部吹氣";
        micBtn.style.background = "#e8f5e9";
        micBtn.style.borderColor = "#c8e6c9";

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

        analyser.smoothingTimeConstant = 0.4;
        analyser.fftSize = 1024;

        microphone.connect(analyser);
        analyser.connect(javascriptNode);
        javascriptNode.connect(audioContext.destination);

        javascriptNode.onaudioprocess = () => {
          if (isBlownOut) return;
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);

          // 計算音量平均值
          let values = 0;
          for (let i = 0; i < array.length; i++) {
            values += array[i];
          }
          const average = values / array.length;

          // 吹氣閾值（通常貼近麥克風吹氣會超過 45-55）
          if (average > 48) {
            extinguishCandle();
          }
        };
      } catch (err) {
        micBtn.innerText = "直接點擊蠟燭也能吹熄喔 👆";
      }
    }

    // 2. 熄滅蠟燭與動畫處置
    function extinguishCandle() {
      if (isBlownOut) return;
      isBlownOut = true;

      // 熄滅火焰
      document.getElementById("flame").classList.add("out");
      document.getElementById("statusText").innerText = "✨ 願望已封存，生日快樂！";
      document.getElementById("wishCard").classList.add("revealed");
      document.getElementById("micBtn").style.display = "none";

      // 釋放麥克風資源
      if (audioContext && audioContext.state !== "closed") {
        audioContext.close();
      }

      // 爆發慶祝彩帶
      celebrateConfetti();
    }

    // 3. 雙側發射彩帶特效
    function celebrateConfetti() {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { x: 0.3, y: 0.6 }
      });
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { x: 0.7, y: 0.6 }
      });
    }
  </script>
</body>
</html>
